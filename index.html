<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <script disable-devtool-auto src='https://cdn.jsdelivr.net/npm/disable-devtool@latest'></script>
    <link rel="icon" href="icon.png" type="image/x-icon">
    <script src='js/snow.js'></script>
    <script src='js/title.js'></script>
</head>

<body>
    <div class="overlay" id="overlay">
        <div class="proceed-button" onclick="removeOverlay()">click to enter</div>
        </div>
        <video id="backgroundVideo" loop>
            <source src="heaven.mp4" type="video/mp4">
        </video>
        <div class="glass-box">
            <h1>tokyo</h1>
            <img src="tokyo.jpg" alt="Profile Picture">
            <div class="spacer"></div>
            <div class="icons">
                <div class="icon-container">
                    <i class="fas fa-crown"></i>
                    <span class="icon-text">@owner</span>
                </div>
                <div class="icon-container">
                    <i class="fas fa-code"></i>
                    <span class="icon-text">@dev</span>
                </div>
            </div>
            <div class="spacer"></div>
            <div id="footer">
                <span id="typing-text" class="typewriter"></span>
            </div>
            <div class="smallspacer"></div>
            <div class="infobox">
                <a href="https://discord.gg/MWATEXCWSZ">
                    <button class="tooltip-button">
                        <i class="fab fa-discord icon-icons"></i>
                        <span class="button-tooltip">discord</span>
                    </button>
                </a>
            </div>
        </div>
        <script src='js/typeing.js'></script>
        <script>
            function playBackgroundVideo() {
                var video = document.getElementById('backgroundVideo');
                video.volume = 0.08;
                video.play();
            }

            function removeOverlay() {
                var overlay = document.getElementById('overlay');
                overlay.style.display = 'none';
                playBackgroundVideo();
                playAudio();
                typeText();
            }
            
            (function () {
                const threshold = 160;
                let devtoolsOpen = false;

                function detectDevTools() {
                    const widthThreshold = window.outerWidth - window.innerWidth > threshold;
                    const heightThreshold = window.outerHeight - window.innerHeight > threshold;

                    if (widthThreshold || heightThreshold) {
                        if (!devtoolsOpen) {
                            devtoolsOpen = true;
                            alert("Dev Tools are not allowed!");
                            window.location.href = "https://www.youtube.com/watch?v=H-fetNUKqDM";
                        }
                    } else {
                        devtoolsOpen = false;
                    }
                }

                setInterval(detectDevTools, 500);

                document.addEventListener("keydown", function (e) {
                    if (e.key === "F12") {
                        e.preventDefault();
                        alert("X3 Sorry!");
                    }

                    if (e.ctrlKey && e.shiftKey && ["I", "J", "C"].includes(e.key.toUpperCase())) {
                        e.preventDefault();
                        alert("UwU Cant Do That Here!");
                    }

                    if (e.ctrlKey && e.key.toUpperCase() === "U") {
                        e.preventDefault();
                        alert(":3 What Are You Trying To Do?");
                    }
                });
            })();
        </script>
</body>

</html>
