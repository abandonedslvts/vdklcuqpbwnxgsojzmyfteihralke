<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="Astro.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Your Website Title">
    <meta property="og:description" content="A description of your site">
    <meta property="og:image" content="https://boytoy.wtf/Astro.png">
    <meta property="og:url" content="https://boytoy.wtf">
    <meta property="og:type" content="website">

    <meta name="theme-color" content="#313131">
    <title>Astro Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.8s ease-out;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-content {
            text-align: center;
        }

        .loading-text {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeInOut 2s infinite;
        }

        .loading-text:hover {
            font-size: 2.8rem;
            letter-spacing: 4px;
        }

        @keyframes fadeInOut {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }

        .main-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-out;
        }

        .main-content.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .image-container {
            margin-bottom: 2rem;
            max-width: 500px;
            width: 100%;
        }

        .image-container img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            filter: grayscale(100%);
        }

        .description {
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: #ccc;
            max-width: 500px;
            line-height: 1.6;
            min-height: 1.8em;
        }

        .typewriter {
            position: relative;
            display: inline-block;
        }

        .typewriter::after {
            content: '|';
            position: absolute;
            right: -8px;
            animation: blink 0.7s infinite;
            color: #ccc;
        }

        @keyframes blink {

            0%,
            49% {
                opacity: 1;
            }

            50%,
            100% {
                opacity: 0;
            }
        }

        .neon-btn {
            padding: 12px 40px;
            font-size: 1.1rem;
            background-color: transparent;
            border: 2px solid #fff;
            color: #fff;
            cursor: pointer;
            border-radius: 50px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            opacity: 0;
            animation: slideUp 0.8s ease-out 0.6s forwards;
            position: relative;
            overflow: hidden;
        }

        .neon-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background-color: #fff;
            transition: left 0.3s ease;
            z-index: -1;
        }

        .neon-btn:hover {
            color: #000;
            transform: scale(1.05);
        }

        .neon-btn:hover::before {
            left: 0;
        }

        .neon-btn:active {
            transform: scale(0.98);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .particle {
            position: absolute;
            bottom: -10px;
            width: 4px;
            height: 4px;
            background-color: #666;
            border-radius: 50%;
            opacity: 0.6;
            animation: floatRight 6s linear infinite;
        }

        @keyframes floatRight {
            0% {
                bottom: -10px;
                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.6;
            }

            100% {
                bottom: 100vh;
                opacity: 0;
                transform: translateX(200px);
            }
        }

        @media (max-width: 768px) {
            .loading-text {
                font-size: 1.8rem;
                letter-spacing: 1px;
            }

            .loading-text:hover {
                font-size: 2rem;
                letter-spacing: 2px;
            }

            .description {
                font-size: 1rem;
            }

            .neon-btn {
                padding: 10px 30px;
                font-size: 0.95rem;
            }

            .image-container {
                max-width: 400px;
            }
        }
    </style>
</head>

<body>
    <div class="particles-container" id="particlesContainer"></div>

    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <div class="loading-text" id="clickText">click to enter</div>
        </div>
    </div>

    <div class="main-content" id="mainContent">
        <div class="image-container">
            <img src="Astro.png" alt="Astro Client">
        </div>
        <p class="description typewriter" id="titleText"></p>
        <button class="neon-btn" id="actionBtn">Join Discord</button>
    </div>

    <audio id="bgMusic" loop>
        <source src="psych0.mp3" type="audio/mpeg">
    </audio>

    <script>
        const loadingScreen = document.getElementById('loadingScreen');
        const clickText = document.getElementById('clickText');
        const mainContent = document.getElementById('mainContent');
        const bgMusic = document.getElementById('bgMusic');
        const actionBtn = document.getElementById('actionBtn');
        const titleText = document.getElementById('titleText');

        function typewriterEffect(element, text, speed = 50) {
            return new Promise((resolve) => {
                let index = 0;

                function type() {
                    if (index < text.length) {
                        element.textContent += text.charAt(index);
                        index++;
                        setTimeout(type, speed);
                    } else {
                        setTimeout(() => {
                            backspace();
                        }, 1500);
                    }
                }

                function backspace() {
                    if (element.textContent.length > 0) {
                        element.textContent = element.textContent.slice(0, -1);
                        setTimeout(backspace, 30);
                    } else {
                        setTimeout(() => {
                            resolve();
                        }, 200);
                    }
                }

                type();
            });
        }

        clickText.addEventListener('click', () => {
            loadingScreen.classList.add('hidden');
            mainContent.classList.add('visible');
            bgMusic.play().catch(err => console.log('Audio play failed:', err));

            setTimeout(() => {
                startTypewriter();
            }, 500);
        });

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !mainContent.classList.contains('visible')) {
                clickText.click();
            }
        });

        actionBtn.addEventListener('click', () => {
            window.open('https://discord.gg/astrovrc', '_blank');
        });

        async function startTypewriter() {
            const titles = ['Astro Client', '.gg/astrovrc', 'The Big A'];
            let titleIndex = 0;

            while (true) {
                await typewriterEffect(titleText, titles[titleIndex], 50);
                titleIndex = (titleIndex + 1) % titles.length;
            }
        }

        const particlesContainer = document.getElementById('particlesContainer');

        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const randomLeft = Math.random() * window.innerWidth;
            const randomDelay = Math.random() * 3;
            const randomDuration = 5 + Math.random() * 3;

            particle.style.left = randomLeft + 'px';
            particle.style.animationDelay = randomDelay + 's';
            particle.style.animationDuration = randomDuration + 's';

            particlesContainer.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, (randomDelay + randomDuration) * 1000);
        }

        setInterval(createParticle, 300);
    </script>
</body>

</html>
